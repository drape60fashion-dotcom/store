<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drape60 Store</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111;--mu:#6b6b6b;--ln:#e8e6df;--sf:#f6f4ee;--ac:#f5c518;--on:#111;--rd:#c0392b;--gr:#2a8a3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e0e;--fg:#f5f5f2;--mu:#a0a09a;--ln:#2a2a28;--sf:#1a1a18;--rd:#ff6b5b;--gr:#4cc16a}}
*{box-sizing:border-box;margin:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
.w{max-width:1000px;margin:0 auto;padding:0 14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--ln)}
.hr{display:flex;align-items:center;gap:10px;padding:10px 0}.logo{font-weight:700;font-size:18px;flex:1}.logo b{background:var(--ac);color:var(--on);padding:0 5px;border-radius:5px}.logo small{display:block;font-size:11px;font-weight:500;color:var(--mu)}
svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib{position:relative;padding:6px}.ib i{position:absolute;top:0;right:0;background:var(--rd);color:#fff;font-style:normal;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;place-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--ln)}.tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn{padding:11px 16px;border-radius:10px;font-weight:600;background:var(--fg);color:var(--bg)}.btn.y{background:var(--ac);color:var(--on)}.btn.o{border:1px solid var(--fg);background:none;color:var(--fg)}.btn.r{background:none;border:1px solid var(--rd);color:var(--rd)}.btn.s{padding:7px 12px;font-size:13px}.btn.f{width:100%}
.card{border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
h2{font-size:18px;margin:18px 0 10px}h3{font-size:15px}.mu{color:var(--mu);font-size:13px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g2{display:grid;gap:12px}@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)!important}}
.g4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi{background:var(--sf);border-radius:12px;padding:14px}.kpi b{font-size:20px;display:block;margin-top:4px}
input.f,select.f,textarea.f{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);margin:4px 0 10px;outline:0}input.f:focus{border-color:var(--fg)}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--sf)}.tag.y{background:var(--ac);color:var(--on)}.tag.r{color:var(--rd)}
.thumb{width:64px;height:80px;border-radius:8px;background:var(--sf);object-fit:cover;flex:none;display:grid;place-items:center;overflow:hidden;font-size:11px;color:var(--mu)}
.old{text-decoration:line-through;color:var(--mu);margin-right:6px}
.low{color:var(--rd);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;text-align:center;border-bottom:1px solid var(--ln)}th:first-child,td:first-child{text-align:left}td input{width:52px;padding:6px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);text-align:center}
.ph{display:flex;gap:8px;flex-wrap:wrap}.ph div{position:relative}.ph img{width:62px;height:78px;object-fit:cover;border-radius:8px}.ph button{position:absolute;top:-6px;right:-6px;background:var(--fg);color:var(--bg);width:20px;height:20px;border-radius:50%;font-size:12px}
#modal{position:fixed;inset:0;background:#0007;z-index:60;display:none;align-items:flex-end;justify-content:center}#modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px;max-height:92vh;overflow-y:auto}@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:10px;z-index:90;max-width:92%;text-align:center}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:10px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mu)}.bars i{width:100%;background:var(--ac);border-radius:5px 5px 0 0;min-height:2px}
.login{max-width:400px;margin:12vh auto;padding:0 18px}

@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.card{animation:up .3s both}.btn{position:relative;overflow:hidden;transition:transform .12s,box-shadow .2s}.btn:active{transform:scale(.97)}.btn.y:hover{box-shadow:0 8px 20px #f5c51877}
.btn.ld{pointer-events:none;color:transparent!important}.btn.ld::after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border:2.5px solid var(--bg);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn.y.ld::after{border-color:var(--on);border-top-color:transparent}.sheet{animation:up .25s}.toast{animation:up .25s}
.ftr{text-align:center;color:var(--mu);font-size:12px;padding:26px 14px 36px;border-top:1px solid var(--ln);margin-top:34px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.fl{display:flex;flex-direction:column;align-items:center;gap:14px;padding:34px 10px;text-align:center}
.fl .rack{display:flex;gap:12px;align-items:flex-end;padding:14px 18px;border-radius:18px;background:var(--sf);max-width:100%;overflow:hidden}
.fl svg.o{width:42px;height:56px;flex:none;fill:none;stroke:var(--fg);stroke-width:1.7;stroke-linejoin:round;opacity:.3;animation:fo 3.6s infinite}
.fl svg.o:nth-child(2){animation-delay:.6s}.fl svg.o:nth-child(3){animation-delay:1.2s}.fl svg.o:nth-child(4){animation-delay:1.8s}.fl svg.o:nth-child(5){animation-delay:2.4s}.fl svg.o:nth-child(6){animation-delay:3s}
@keyframes fo{0%,100%{opacity:.3;transform:none;fill:none}8%,22%{opacity:1;transform:translateY(-9px);fill:#f5c51866;stroke:#b98a00}32%{opacity:.3;transform:none}}
.fl .bar{width:170px;height:4px;background:var(--ln);border-radius:2px;overflow:hidden}.fl .bar i{display:block;height:100%;width:40%;background:var(--ac);border-radius:2px;animation:slide 1.2s infinite}
@keyframes slide{from{margin-left:-40%}to{margin-left:100%}}
.fl .tp{position:relative;height:20px;width:270px;font-size:13px;color:var(--mu)}.fl .tp span{position:absolute;inset:0;opacity:0;animation:tp 8s infinite}.fl .tp span:nth-child(2){animation-delay:2s}.fl .tp span:nth-child(3){animation-delay:4s}.fl .tp span:nth-child(4){animation-delay:6s}
@keyframes tp{0%{opacity:0;transform:translateY(6px)}5%,22%{opacity:1;transform:none}27%,100%{opacity:0}}
#pop{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translate(-50%,-160%);z-index:95;width:min(94vw,460px);transition:transform .35s}#pop.on{transform:translate(-50%,0)}
.pc{display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--ln);box-shadow:0 12px 40px #0004;border-radius:16px;padding:10px}.pc img,.pi{width:56px;height:70px;object-fit:cover;border-radius:10px;background:var(--sf);flex:none}
.phs{display:flex;gap:10px;flex-wrap:wrap}.pw{position:relative;width:84px}.pw img{width:84px;height:104px;object-fit:cover;border-radius:8px}.pw .x{position:absolute;top:-6px;right:-6px;background:var(--fg);color:var(--bg);width:20px;height:20px;border-radius:50%;font-size:12px}.pw select{width:100%;font-size:11px;padding:3px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);margin-top:4px}
.vb{background:var(--sf);border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:13px}.vb a{font-weight:700}
.stp{display:flex;gap:6px;margin:10px 0}.stp i{flex:1;height:4px;border-radius:2px;background:var(--ln)}.stp i.on{background:var(--ac)}
.chip{padding:7px 14px;border:1px solid var(--ln);border-radius:20px;font-size:13px}.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn[disabled]{opacity:.45;pointer-events:none}

.prg{display:flex;gap:4px;margin:8px 0}.prg i{flex:1;height:4px;border-radius:2px;background:var(--ln);transition:background .4s}.prg i.on{background:var(--ac)}
.bars div{position:relative}.bars i{transform-origin:bottom;animation:grow .6s both}@keyframes grow{from{transform:scaleY(0)}}
.kpi{transition:transform .2s}.kpi:hover{transform:translateY(-2px)}
.empt{text-align:center;color:var(--mu);padding:26px 10px;background:var(--sf);border-radius:12px;margin-top:12px}
</style></head><body>
<div id="root"></div><footer class="ftr">© 2026 Drape60 · Partner store app · Hyderabad</footer><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),fm=n=>'₹'+Math.round(n).toLocaleString('en-IN'),today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const OUT=['M20 4h10l2 12-4 6 8 8-6 30H18L14 30l8-8-4-6z','M20 4h10l3 12H17zM17 16l-4 44h24l-4-44','M18 6l7-3 7 3 12 12-5 6-5-4v32H16V20l-5 4-5-6z','M16 6l9 4 9-4 12 10-6 8-4-3v31H14V21l-4 3-6-8z','M14 4h22l4 56H29l-4-36-4 36H10z','M20 4h10l2 16 14 40H4l14-40z'];
const FL=()=>`<div class="fl"><div class="logo" style="font-size:26px">Drape<b>60</b></div><div class="rack">${OUT.map(d=>`<svg class="o" viewBox="0 0 50 64"><path d="${d}"/></svg>`).join('')}</div><div class="bar"><i></i></div><div class="tp"><span>Folding fresh arrivals…</span><span>Counting your stock…</span><span>Checking new orders…</span><span>Setting up your store…</span></div></div>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API_URL='https://script.google.com/macros/s/AKfycbw4LnEmSac8VSTOkLUHKIfqgan7rFEpzMi5KUZvFnGwrElf4ax-C4vb7HNOXI99Gs8/exec';/* paste your Apps Script web app URL here */
let TOK=null,PT=null,busy=0;const ld=(b,on)=>{if(b)b.classList.toggle('ld',!!on)};
const api=(a,d)=>API_URL?fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({a,d,t:TOK})}).then(r=>r.json()).catch(()=>({err:'Network error'})):Promise.resolve({err:'offline'});
const AREAS=['Kukatpally','Madhapur','Manikonda','Gachibowli','Miyapur','Hitech City','Kondapur','Banjara Hills','Jubilee Hills','Ameerpet','Begumpet','Secunderabad','Nizampet','Bachupally','Attapur','Mehdipatnam','Uppal','Dilsukhnagar','Charminar','Kokapet'],CATS=['Jeans','Shirts','T-Shirts','Kurtas','Ethnic','Dresses','Trousers','Jackets','Hoodies','Co-ords'];
const sizes=(c,g)=>c=='Jeans'?(g=='W'?['26','28','30','32']:['28','30','32','34','36']):['XS','S','M','L','XL'];
function seed(){const h=[];for(let i=0;i<180;i++){const d=new Date();d.setDate(d.getDate()-i);h.push({d:d.toISOString().slice(0,10),a:Math.round(3000+((i*37)%17)*420+(i%7>4?2500:0))})}
return{store:{name:'Youvthi',email:'owner@youvthi.example',phone:'9876543210',area:'Madhapur',addr:'Plot 12, Madhapur Main Road, Hyderabad'},hist:[],orders:[],notes:[],log:[],sync:0,sound:true,
products:[{id:1,n:'Slim Stretch Jeans',g:'M',c:'Jeans',p:1799,d:'Mid-rise slim jeans in soft stretch denim.',imgs:[],cols:{Indigo:{28:6,30:8,32:3,34:5,36:4},Black:{28:2,30:7,32:6,34:4,36:5}},off:null},
{id:2,n:'Oversized Graphic Tee',g:'M',c:'T-Shirts',p:999,d:'Heavy cotton oversized tee with a back graphic.',imgs:[],cols:{Black:{XS:4,S:9,M:12,L:8,XL:2},White:{XS:6,S:6,M:7,L:5,XL:5}},off:{pct:20,from:today(),to:null}},
{id:3,n:'Denim Jacket',g:'M',c:'Jackets',p:2999,d:'Classic trucker jacket with a slightly boxy fit.',imgs:[],cols:{Blue:{S:5,M:6,L:4,XL:3}},off:null}]}}
let D=seed();try{const x=JSON.parse(localStorage.getItem('d60s'));if(x)D=x}catch(e){}
D.kyc=D.kyc||{};D.store=D.store||{};
if(D.v!=2){D.hist=[];D.v=2}
let U=null,T={v:'orders',sess:0,pf:null,sw:'d'};
const save=(sheet,act)=>{D.sync++;try{localStorage.setItem('d60s',JSON.stringify(Object.assign({},D,{kyc:undefined})))}catch(e){toast('Storage full: remove some photos')}push()};
const push=()=>{if(!API_URL||!TOK)return;clearTimeout(PT);busy=1;PT=setTimeout(()=>{api('store.push',{store:D.store,products:D.products,orders:D.orders.map(o=>o.sim?{id:o.id,pid:o.pid,status:o.st,name:o.n,color:o.c,size:o.s,qty:o.q,amt:o.amt,custName:o.cust,phone:o.ph,addr:o.adr,mode:o.mode,pickupCode:o.code}:{id:o.id,status:o.st})}).then(r=>{busy=0;if(r.err)return toast('Sync failed: '+r.err);if(r.products)D.products=r.products;D.sync=0;try{localStorage.setItem('d60s',JSON.stringify(Object.assign({},D,{kyc:undefined})))}catch(e){}})},700)};
const log=a=>{if(API_URL&&TOK)api('activity',{who:D.store.name,role:'store',action:a});D.log.unshift({t:new Date().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}),a});D.log=D.log.slice(0,80)};
function note(m,k,pid){D.notes.unshift({t:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),m,r:0,k,pid});D.notes=D.notes.slice(0,60);bell()}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3000)}
/* sound */
let AC;document.addEventListener('click',()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}},{once:true});function ring(){if(!D.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[880,1175,880,1175].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);const s=AC.currentTime+i*.22;g.gain.setValueAtTime(.25,s);g.gain.exponentialRampToValueAtTime(.001,s+.2);o.start(s);o.stop(s+.21)})}catch(e){}}
/* helpers */
const offOn=p=>p.off&&p.off.from<=today()&&(!p.off.to||p.off.to>=today());
const sale=p=>offOn(p)?Math.round(p.p*(1-p.off.pct/100)):p.p;
const tot=p=>Object.values(p.cols).reduce((s,c)=>s+Object.values(c).reduce((a,b)=>a+b,0),0);
function lowCheck(p){const l=[];for(const c in p.cols)for(const s in p.cols[c])if(p.cols[c][s]<5)l.push(`${c} ${s}: ${p.cols[c][s]} left`);
if(l.length){const m=`Low stock on ${p.n}: ${l.slice(0,3).join(', ')}${l.length>3?' +'+(l.length-3)+' more':''}`;if(!D.notes.some(n=>n.m==m)){note(m,'low',p.id);popAlert({pid:p.id,title:'Low stock',body:m.replace('Low stock on ','')});log('Stock email alert queued to '+D.store.email+' ('+p.n+')')}}return l}
const bell=()=>{const n=D.notes.filter(x=>!x.r).length,b=$('#bn');if(b){b.textContent=n;b.style.display=n?'grid':'none'}document.title=(n?'('+n+') ':'')+'Drape60 Store'};
/* login: one OTP to both email and phone */
function regView(step){$('#root').innerHTML=`<div class="login"><div class="logo" style="font-size:24px">Drape<b>60</b> Store</div><p class="mu" style="margin:6px 0 18px">Register your store · Hyderabad only</p>`+(step?`<p class="mu">Enter the code sent to ${esc(T.rg.email)}.</p><input class="f" id="ot" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"><button class="btn y f" id="vb">Verify and continue</button>`:`<input class="f" id="rn" placeholder="Store name"><input class="f" id="ro" placeholder="Owner name"><input class="f" id="re" placeholder="Business email"><input class="f" id="rp" placeholder="Mobile number" inputmode="numeric" maxlength="10"><button class="btn y f" id="sb">Send OTP</button>`)+`<p class="mu" style="margin-top:14px;text-align:center"><a href="#" id="bk">Back to login</a></p></div>`;
$('#bk').onclick=e=>{e.preventDefault();loginView()};
if(!step)$('#sb').onclick=()=>{const g=k=>$('#'+k).value.trim(),name=g('rn'),owner=g('ro'),email=g('re').toLowerCase(),phone=g('rp');
if(!name||!owner)return toast('Enter your store and owner name');if(!/^\S+@\S+\.\S+$/.test(email))return toast('Enter a valid email');if(!/^[6-9]\d{9}$/.test(phone))return toast('Enter a valid 10-digit mobile number');
T.rg={name,owner,email,phone};ld($('#sb'),1);api('otp',{role:'storereg',email,phone}).then(r=>{ld($('#sb'),0);r.err?toast(r.err):(regView(1),toast('OTP sent to your email'))})};
else $('#vb').onclick=()=>{ld($('#vb'),1);api('verify',{role:'storereg',id:T.rg.email,phone:T.rg.phone,name:T.rg.name,owner:T.rg.owner,code:$('#ot').value}).then(async r=>{ld($('#vb'),0);if(r.err)return toast(r.err);
TOK=r.token;U=1;T.sess=Date.now();$('#root').innerHTML='<div class="login">'+FL()+'</div>';D.products=[];D.orders=[];D.notes=[];D.kyc={};await pull(1);T.v='verify';log('Registered store');save();app();clearInterval(T.iv);T.iv=setInterval(()=>pull(),8000)})}}
function loginView(step,otp){$('#root').innerHTML=`<div class="login"><div class="logo" style="font-size:24px">Drape<b>60</b> Store</div><p class="mu" style="margin:6px 0 20px">Partner login · Hyderabad stores only</p>`+(step?`<p class="mu">One code was sent to your registered email and phone.</p><input class="f" id="ot" inputmode="numeric" maxlength="6" placeholder="6-digit OTP" autofocus><button class="btn y f" id="vb">Verify and log in</button>`:`<input class="f" id="em" placeholder="Registered email" value="${API_URL?'':D.store.email}"><input class="f" id="ph" placeholder="Registered phone" value="${API_URL?'':D.store.phone}"><button class="btn y f" id="sb">Send OTP</button>${API_URL?'<p class="mu" style="margin-top:16px;text-align:center">New seller? <a href="#" id="rg">Register your store</a></p>':''}`)+`</div>`;
if(!step&&$('#rg'))$('#rg').onclick=e=>{e.preventDefault();regView(0)};
if(!step)$('#sb').onclick=()=>{const em=$('#em').value.trim(),ph=$('#ph').value.trim();if(API_URL){T.em=em;T.ph=ph;ld($('#sb'),1);api('otp',{role:'store',email:em,phone:ph}).then(r=>{ld($('#sb'),0);r.err?toast(r.err):(loginView(1),toast('OTP sent to your email'+(r.sms?' and phone':'')))});return}if(em!=D.store.email||ph!=D.store.phone)return toast('Email or phone does not match our records');const o=String(Math.floor(100000+Math.random()*900000));loginView(1,o);toast('Demo OTP: '+o+' (sent to email and phone once the backend is live)');T.otp=o};
else $('#vb').onclick=()=>{if(API_URL){ld($('#vb'),1);api('verify',{role:'store',id:T.em,phone:T.ph,code:$('#ot').value}).then(async r=>{ld($('#vb'),0);if(r.err)return toast(r.err);TOK=r.token;U=1;T.sess=Date.now();$('#root').innerHTML='<div class="login">'+FL()+'</div>';await pull(1);if(vstat()!='Verified')T.v='verify';log('Logged in');save();ring();app();clearInterval(T.iv);T.iv=setInterval(()=>pull(),8000)});return}if($('#ot').value!=T.otp)return toast('Incorrect OTP');U=1;T.sess=Date.now();log('Logged in');save();ring();app()}}
function out(){const m=Math.round((Date.now()-T.sess)/60000);log('Logged out · session '+m+' min');save();U=null;TOK=null;loginView()}
window.addEventListener('pagehide',()=>{if(U&&API_URL&&TOK)navigator.sendBeacon(API_URL,JSON.stringify({a:'activity',d:{who:D.store.name,role:'store',action:'session',mins:Math.round((Date.now()-T.sess)/60000)},t:TOK}))});
/* shell */
function app(){$('#root').innerHTML=`<header><div class="w"><div class="hr"><div class="logo">Drape<b>60</b> Store<small>${D.store.name} · ${D.store.area}</small></div><button class="ib" id="snd" aria-label="Sound"></button><button class="ib" id="bl" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg><i id="bn"></i></button></div>

const ch=e=>{const el=e.target.closest('.oc');if(!el)return;if(e.target.classList.contains('os'))el.querySelector('.oq').style.display=e.target.value=='custom'?'':'none';if(e.target.classList.contains('ou'))el.querySelector('.od2').disabled=e.target.checked;prev(el)};
$('#m').onchange=ch;$('#m').oninput=ch;
$('#m').onclick=e=>{const b=e.target.closest('button');if(!b)return;const tg=k=>k=='all'?D.products:D.products.filter(p=>String(p.id)==k);
if(b.dataset.oa){const k=b.dataset.oa,o=readOff(b.closest('.card').querySelector('.oc'));if(o.err)return toast(o.err);tg(k).forEach(p=>p.off=Object.assign({},o.off));log(`Offer ${o.off.pct}% on ${k=='all'?'all products':tg(k)[0].n}`);save();app();toast('Offer saved')}
else if(b.dataset.or){const k=b.dataset.or;tg(k).forEach(p=>p.off=null);log('Offer removed on '+(k=='all'?'all products':tg(k)[0].n));save();app();toast('Offer removed')}
else if(b.dataset.c){api('store.approve',{code:b.dataset.c,on:+b.dataset.ap}).then(r=>{if(r.err)return toast(r.err);pull(0,1);toast('Updated')})}}}
/* sales */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function buckets(m){const n=new Date(),o=[];
if(m=='d')for(let i=6;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-i);o.push({k:ymd(d),l:DAY[d.getDay()]+' '+d.getDate()})}
else if(m=='w'){const wd=(n.getDay()+6)%7;for(let i=7;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-wd-7*i);o.push({k:ymd(d),l:d.getDate()+' '+MON[d.getMonth()]})}}
else if(m=='m')for(let i=11;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);o.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:MON[d.getMonth()]})}
else for(let i=2;i>=0;i--)o.push({k:String(n.getFullYear()-i),l:String(n.getFullYear()-i)});return o}
function keyOf(m,dt){const d=new Date(dt);if(isNaN(d))return'';if(m=='d')return ymd(d);if(m=='w'){const wd=(d.getDay()+6)%7;return ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()-wd))}if(m=='m')return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return String(d.getFullYear())}
function sales(){if(vstat()!='Verified'){$('#m').innerHTML=lockMsg();return}
const m=T.sw||'d',done=D.orders.filter(o=>o.st=='done'),B=buckets(m),at=o=>o.dAt||o.pl,
val=B.map(b=>done.filter(o=>keyOf(m,at(o))==b.k).reduce((a,o)=>a+(+o.amt||0),0)),cnt=B.map(b=>done.filter(o=>keyOf(m,at(o))==b.k).length),
mx=Math.max(...val,1),sum=val.reduce((a,b)=>a+b,0),n=cnt.reduce((a,b)=>a+b,0),tk=ymd(new Date()),td=done.filter(o=>keyOf('d',at(o))==tk),
live=D.orders.filter(o=>!['done','rejected'].includes(o.st)).length,can=D.orders.filter(o=>o.st=='rejected').length,ttl={d:'Last 7 days',w:'Last 8 weeks',m:'Last 12 months',y:'Last 3 years'}[m];
$('#m').innerHTML=`<div class="row sp"><h2>Sales dashboard</h2><div class="row">${[['d','Day'],['w','Week'],['m','Month'],['y','Year']].map(x=>`<button class="tab ${m==x[0]?'on':''}" data-s="${x[0]}">${x[1]}</button>`).join('')}</div></div>
<div class="g4"><div class="kpi">Today’s sales<b>${fm(td.reduce((a,o)=>a+(+o.amt||0),0))}</b></div><div class="kpi">Delivered today<b>${td.length}</b></div><div class="kpi">Live orders<b>${live}</b></div><div class="kpi">Cancelled<b>${can}</b></div></div>
<div class="g4" style="margin-top:10px"><div class="kpi">Sales · ${ttl}<b>${fm(sum)}</b></div><div class="kpi">Delivered · ${ttl}<b>${n}</b></div><div class="kpi">Average order<b>${fm(n?sum/n:0)}</b></div><div class="kpi">All-time delivered<b>${done.length}</b></div></div>
<div class="card" style="margin-top:12px"><b>${ttl}</b><div class="bars">${val.map((x,i)=>`<div><span>${x?(x>=1000?(x/1000).toFixed(1)+'k':x):''}</span><i style="height:${x/mx*100}%;${x?'':'opacity:.25'}"></i><span>${B[i].l}</span></div>`).join('')}</div>${done.length?'':'<div class="empt">No sales yet. Your numbers start at zero and grow as orders are delivered.</div>'}</div>`;
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{T.sw=b.dataset.s;sales()})}
/* alerts */
function alerts(){$('#m').innerHTML=`<div class="row sp"><h2>Notifications</h2><button class="btn s o" id="mr">Mark all read</button></div>`+(D.notes.length?D.notes.map(n=>{const im=n.pid?pimg(n.pid):'';return `<div class="card row sp" style="flex-wrap:nowrap;${n.r?'opacity:.6':''}"><div class="row" style="flex-wrap:nowrap">${im?`<img class="thumb" src="${im}" alt="">`:''}<span>${n.k=='low'?'⚠ ':n.k=='order'?'🛍 ':''}${esc(n.m)}</span></div><span class="mu">${n.t}</span></div>`}).join(''):'<p class="mu">Nothing yet.</p>');$('#mr').onclick=()=>{D.notes.forEach(n=>n.r=1);save();app()};D.notes.forEach(n=>n.r=1);save();bell()}
/* verification */
const VCOL={Draft:'',Pending:'y','Under Review':'y',Verified:'y',Rejected:'r','More Documents Required':'r'};
const MSG={Draft:'Complete all five stages and submit. Our team reviews every store before it goes live.',Pending:'Submitted. Our team will start reviewing soon. This usually takes 1 to 3 working days and we will email you.','Under Review':'Our team is reviewing your documents.',Verified:'Your store is live and can receive orders.',Rejected:'Your application was not approved. Read the note, fix the details and resubmit.','More Documents Required':'Please add the documents mentioned in the note, then resubmit.'};
const vstat=()=>D.store.verifyStatus||'Verified',vedit=()=>['Draft','Rejected','More Documents Required'].includes(vstat());
const vb=()=>vstat()=='Verified'?'':`<div class="vb">Verification: <b>${vstat()}</b>. Your store is not live yet. <a href="#" data-go="verify">Open</a></div>`;
const TABS=()=>{const b=[['orders','Orders'],['stock','Products'],['offers','Offers'],['sales','Sales'],['alerts','Alerts'],['me','Profile']],v=['verify','Verification'];if(vstat()!='Verified')b.unshift(v);else b.splice(5,0,v);return b};
const BIZ=['Individual / Proprietor','Partnership firm','Private Limited','LLP','Other'];
const STG=[
{t:'PAN, business and owner identity',f:[{k:'bizType',l:'Business type',t:'sel',o:BIZ},{k:'bizName',l:'Registered business or trade name',t:'txt'},{k:'pan',l:'PAN number',t:'pan'},{k:'panName',l:'Name as on PAN',t:'txt'},{k:'ownerName',l:'Owner full name',t:'txt'},{k:'ownerPhone',l:'Owner mobile',t:'tel'},{k:'ownerEmail',l:'Owner email',t:'email'},{k:'mgrName',l:'Authorised manager name (if different)',t:'txt',opt:1},{k:'mgrPhone',l:'Manager mobile',t:'tel',opt:1},{k:'idType',l:'Owner ID proof',t:'sel',o:['Aadhaar','Voter ID','Passport','Driving licence']},{k:'idDoc',l:'Upload owner ID proof',t:'file'},{k:'panDoc',l:'Upload PAN card',t:'file'},{k:'regDoc',l:'Registration proof (shop licence, incorporation or Udyam)',t:'file'}]},
{t:'GST details',f:[{k:'gstMode',l:'GST status',t:'sel',o:['I have a GSTIN','I am an unregistered seller']},{k:'gstin',l:'GSTIN',t:'gstin',w:d=>d.gstMode=='I have a GSTIN'},{k:'gstDoc',l:'Upload GST certificate',t:'file',w:d=>d.gstMode=='I have a GSTIN'},{k:'unregNote',l:'Why you are exempt from GST registration (turnover, state, category)',t:'area',w:d=>d.gstMode=='I am an unregistered seller'}]},
{t:'Bank account',f:[{k:'accName',l:'Account holder name',t:'txt'},{k:'bank',l:'Bank name',t:'txt'},{k:'accNo',l:'Account number',t:'acc'},{k:'ifsc',l:'IFSC code',t:'ifsc'},{k:'chequeDoc',l:'Upload cancelled cheque or bank proof',t:'file'}]},
{t:'Store, location and operations',f:[{k:'storeName',l:'Store name',t:'txt'},{k:'storeAddr',l:'Full store address with pincode',t:'area'},{k:'mapLink',l:'Google Maps link of your store',t:'maps'},{k:'storePhone',l:'Store contact number',t:'tel'},{k:'storeEmail',l:'Business email',t:'email'},{k:'cats',l:'Categories you sell',t:'multi',o:['Women','Men','Kids','Footwear','Accessories']},{k:'returns',l:'Return and exchange policy',t:'area'},{k:'dispatch',l:'Order acceptance and dispatch',t:'sel',o:['I can accept and pack within 10 minutes','I can accept and pack within 20 minutes','I can accept and pack within 30 minutes']},{k:'cName',l:'Customer complaint contact person',t:'txt'},{k:'cPhone',l:'Complaint contact mobile',t:'tel'},{k:'photos',l:'Store photos (front, inside, stock; at least 2)',t:'files',min:2,max:6},{k:'brandDoc',l:'Brand ownership or authorisation proof (or purchase invoices)',t:'file'}]},
{t:'Agreement and declarations',f:[{k:'agree',l:'I accept the Drape60 seller agreement and policies',t:'chk'},{k:'decl',l:'I declare that all product descriptions and photographs I upload accurately represent the products',t:'chk'},{k:'sign',l:'Type your full name as your signature',t:'txt'}]}];
const RX={pan:[/^[A-Z]{5}[0-9]{4}[A-Z]$/,'Enter a valid PAN (for example ABCDE1234F)'],tel:[/^[6-9]\d{9}$/,'Enter a valid 10-digit mobile number'],email:[/^\S+@\S+\.\S+$/,'Enter a valid email'],gstin:[/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/,'Enter a valid 15-character GSTIN'],ifsc:[/^[A-Z]{4}0[A-Z0-9]{6}$/,'Enter a valid IFSC code'],acc:[/^\d{9,18}$/,'Enter a valid account number (9 to 18 digits)'],maps:[/^https?:\/\/(www\.)?(google\.[a-z.]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps|maps\.google)/i,'Paste the Google Maps share link of your store']};
function vErr(n){const d=D.kyc['s'+n]||{};for(const f of STG[n-1].f){if(f.w&&!f.w(d))continue;const v=d[f.k];if(f.opt&&!v)continue;
if(f.t=='chk'){if(!v)return 'Please tick: '+f.l;continue}
if(f.t=='multi'){if(!Array.isArray(v)||!v.length)return 'Choose at least one category';continue}
if(f.t=='files'){if(!Array.isArray(v)||v.length<(f.min||1))return 'Add at least '+(f.min||1)+' store photos';continue}
if(!v)return 'Please fill: '+f.l;if(RX[f.t]&&!RX[f.t][0].test(v))return RX[f.t][1]}return ''}
function fieldHTML(f,v){const id='kf_'+f.k,r=f.opt?'':' *',lb=`<label class="mu">${f.l}${r}</label>`;
if(f.t=='sel')return lb+`<select class="f" id="${id}"><option value="">Select</option>${f.o.map(o=>`<option ${v==o?'selected':''}>${o}</option>`).join('')}</select>`;
if(f.t=='area')return lb+`<textarea class="f" id="${id}" rows="3">${esc(v||'')}</textarea>`;
if(f.t=='multi'){const a=Array.isArray(v)?v:[];return lb+`<div class="row" style="margin:6px 0 12px">${f.o.map(o=>`<button type="button" class="chip ${a.includes(o)?'on':''}" data-mc="${f.k}" data-v="${o}">${o}</button>`).join('')}</div>`}
if(f.t=='file'||f.t=='files'){const a=f.t=='files'?(Array.isArray(v)?v:[]):(v?[v]:[]);return lb+`<div class="row" style="margin:6px 0 12px">${a.map(u=>`<span class="tag">${String(u).indexOf('http')==0?`<a href="${u}" target="_blank" rel="noopener">Uploaded ✓</a>`:'Ready to upload ✓'}</span>`).join('')}<input type="file" id="${id}" ${f.t=='files'?'multiple':''} accept="${f.t=='files'?'image/*':'image/*,application/pdf'}"></div>`}
if(f.t=='chk')return `<label style="display:flex;gap:10px;margin:12px 0;align-items:flex-start"><input type="checkbox" id="${id}" ${v?'checked':''} style="margin-top:3px"><span>${f.l}</span></label>`;
return lb+`<input class="f" id="${id}" value="${esc(v||'')}" ${f.t=='tel'?'inputmode="numeric" maxlength="10"':''}>`}
const fdata=f=>new Promise((res,rej)=>{if(f.type.indexOf('image/')==0){const i=new Image();i.onload=()=>{const k=Math.min(1,1100/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};i.onerror=()=>rej('Could not read the image');i.src=URL.createObjectURL(f)}else{if(f.size>3.5e6)return rej('PDF is larger than 3.5 MB');const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej('Could not read the file');r.readAsDataURL(f)}});
function rd(n){const d=D.kyc['s'+n]=D.kyc['s'+n]||{};STG[n-1].f.forEach(f=>{const el=$('#kf_'+f.k);if(!el||f.t=='file'||f.t=='files')return;if(f.t=='chk')d[f.k]=el.checked;else{let v=el.value.trim();if(f.t=='pan'||f.t=='gstin'||f.t=='ifsc')v=v.toUpperCase();d[f.k]=v}})}
async function saveKyc(submit,btn){if(!API_URL){toast('Connect the backend to submit verification');return null}ld(btn,1);const r=await api('store.kyc',{kyc:D.kyc,submit});ld(btn,0);if(r.err){toast(r.err);return null}D.kyc=r.kyc;D.store.verifyStatus=r.verifyStatus;return r}
function wiz(n){const S0=STG[n-1],d=D.kyc['s'+n]=D.kyc['s'+n]||{};
mod(`<div class="row sp"><h3>Step ${n} of 5</h3><button id="x">✕</button></div><div class="stp">${STG.map((_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div><h3 style="margin:10px 0 12px">${S0.t}</h3>${S0.f.filter(f=>!f.w||f.w(d)).map(f=>fieldHTML(f,d[f.k])).join('')}<div class="row" style="margin-top:14px"><button class="btn o" id="bk" ${n>1?'':'disabled'}>Back</button><button class="btn o" id="dr">Save draft</button><button class="btn y" id="nx" style="flex:1">${n==5?'Submit for verification':'Save and continue'}</button></div>`);
$('#x').onclick=()=>{rd(n);mod();verify()};
document.querySelectorAll('[data-mc]').forEach(b=>b.onclick=()=>{const a=d[b.dataset.mc]=Array.isArray(d[b.dataset.mc])?d[b.dataset.mc]:[],i=a.indexOf(b.dataset.v);i<0?a.push(b.dataset.v):a.splice(i,1);b.classList.toggle('on')});
document.querySelectorAll('.sheet select').forEach(x=>x.onchange=()=>{rd(n);wiz(n)});
document.querySelectorAll('.sheet input[type=file]').forEach(inp=>inp.onchange=async()=>{rd(n);const f=S0.f.find(x=>'kf_'+x.k==inp.id);try{if(f.t=='files'){const a=d[f.k]=Array.isArray(d[f.k])?d[f.k]:[];for(const file of inp.files){if(a.length>=(f.max||6))break;a.push(await fdata(file))}}else d[f.k]=await fdata(inp.files[0])}catch(e){toast(String(e))}wiz(n)});
$('#bk').onclick=()=>{rd(n);wiz(n-1)};
$('#dr').onclick=async()=>{rd(n);const r=await saveKyc(false,$('#dr'));if(r){toast('Draft saved');wiz(n)}};
$('#nx').onclick=async()=>{rd(n);const e=vErr(n);if(e)return toast(e);
if(n<5){const r=await saveKyc(false,$('#nx'));if(r||!API_URL)wiz(n+1);return}
for(let i=1;i<=5;i++){const e2=vErr(i);if(e2){toast('Step '+i+': '+e2);return wiz(i)}}
const r=await saveKyc(true,$('#nx'));if(r){log('Verification submitted');mod();toast('Submitted. We will review it within 1 to 3 working days.');app()}}}
function verify(){const st=vstat();
$('#m').innerHTML=`<h2>Seller verification</h2><div class="card"><div class="row sp"><b>Status</b><span class="tag ${VCOL[st]||''}">${st}</span></div>${D.store.adminNote?`<p style="margin-top:8px"><b>Note from Drape60:</b> ${esc(D.store.adminNote)}</p>`:''}<p class="mu" style="margin-top:8px">${MSG[st]||''}</p></div>
${STG.map((s,i)=>{const ok=D.kyc['s'+(i+1)]&&!vErr(i+1);return `<div class="card row sp"><div><b>${i+1}. ${s.t}</b><div class="mu">${ok?'Completed ✓':'Not completed'}</div></div>${vedit()?`<button class="btn s ${ok?'o':'y'}" data-w="${i+1}">${ok?'Edit':'Start'}</button>`:''}</div>`}).join('')}
${vedit()?`<button class="btn y f" data-w="1" style="margin-top:6px">${st=='Draft'?'Continue verification':'Update and resubmit'}</button>`:''}<p class="mu" style="margin:14px 0">Sizes and stock are added when you create your products.</p>`;
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>wiz(+b.dataset.w))}
/* profile */
function me(){const s=D.store;$('#m').innerHTML=`<h2>Store details</h2><div class="card"><p class="mu">Store name</p><input class="f" id="sn" value="${s.name}"><p class="mu">Area</p><input class="f" id="sa" list="al" value="${s.area}"><datalist id="al">${AREAS.map(a=>`<option>${a}</option>`).join('')}</datalist><p class="mu">Address</p><textarea class="f" id="ad" rows="3">${s.addr}</textarea><p class="mu">Alert email · Phone</p><input class="f" id="se" value="${s.email}"><input class="f" id="sp" value="${s.phone}"><button class="btn y f" id="ss">Save changes</button><p class="mu" style="margin-top:8px">${D.sync} change(s) waiting to sync to Google Sheets.</p></div><h2>Activity log</h2>${D.log.slice(0,25).map(l=>`<div class="row sp" style="padding:6px 0;border-bottom:1px solid var(--ln)"><span>${l.a}</span><span class="mu">${l.t}</span></div>`).join('')}<br><button class="btn o f" id="lo">Log out</button><div style="height:40px"></div>`;
$('#ss').onclick=()=>{Object.assign(s,{name:$('#sn').value,area:$('#sa').value,addr:$('#ad').value,email:$('#se').value,phone:$('#sp').value});log('Store details / address updated');save();app();toast('Saved')};$('#lo').onclick=out}
async function pull(first,force){if(!TOK||busy)return;const r=await api('store.boot',{});if(r.err)return;
if(first){const {kyc,...rest}=r.store;if(D.store.id&&D.store.id!=rest.id){D.notes=[];D.log=[]}D.store=Object.assign(D.store,rest);D.kyc=kyc&&typeof kyc=='object'?kyc:{};D.products=r.products}
else{const ov=D.store.verifyStatus;D.store.verifyStatus=r.store.verifyStatus;D.store.adminNote=r.store.adminNote;if(ov!=r.store.verifyStatus){note('Verification status: '+(r.store.verifyStatus||'Verified'),'ver');ring();osNotify('Verification: '+(r.store.verifyStatus||'Verified'),'Open the app to see details');if(U)app()}}D.coupons=r.coupons||[];
const mine=r.orders.map(x=>({id:x.id,pid:x.pid,n:x.name,c:x.color,s:String(x.size),q:+x.qty,amt:+x.amt,cust:x.custName||x.custId,ph:String(x.phone||x.custId||''),adr:(x.addr||'')+(x.area?' · '+x.area:''),st:x.status=='packed'?'packing':x.status,mode:x.mode||'delivery',code:x.pickupCode||'',rider:x.riderName?{n:x.riderName,p:x.riderPhone,l:x.riderLink}:null,dAt:x.deliveredAt||x.updated,pl:x.placed,t:new Date(x.placed).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}));
const known=new Set(D.orders.map(o=>String(o.id))),fresh=mine.filter(o=>!known.has(String(o.id))&&o.st=='new');
D.orders=mine;if(!first&&fresh.length){fresh.forEach(o=>{note(`New order #${o.id} · ${o.n} · ${fm(o.amt)}`,'order',o.pid);popAlert({pid:o.pid,title:'New order #'+o.id,body:`${o.n} · ${o.c} · ${o.s} · ${fm(o.amt)}`,order:1})});ring();T.lr=Date.now()}
if(!first&&D.sound&&D.orders.some(o=>o.st=='new')&&Date.now()-(T.lr||0)>30000){T.lr=Date.now();ring()}
if(!first&&(force||fresh.length)&&U&&['orders','offers'].includes(T.v)&&!$('#modal').className)app();else bell()}
regSW();loginView();
</script></body></html>
